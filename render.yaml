services:
  - type: web
    name: dramaturg
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_REQUEST_DELAY_SECONDS
        value: "30"
      - key: RATE_LIMIT_PER_HOUR
        value: "3"
      - key: GLOBAL_DAILY_ANALYSIS_LIMIT
        value: "50"
      - key: ANALYSIS_CACHE_TTL_SECONDS
        value: "21600"
